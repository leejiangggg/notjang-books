<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>낱장북스 · 엽서 쓰기</title>
<meta name="theme-color" content="#161616">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:title" content="엽서 쓰기 · 낱장북스">
<meta property="og:description" content="앞면에는 사진, 뒷면에는 편지. 링크로 보내는 엽서 한 장.">
<meta property="og:image" content="https://notjangbooks.com/assets/og.png">
<meta property="og:url" content="https://notjangbooks.com/postcard.html">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Serif:wght@400;700;800&family=Noto+Serif+KR:wght@400;700;800&display=swap">
<link rel="stylesheet" href="css/site.css?v=45">
<link rel="stylesheet" href="css/write.css?v=45">
<link rel="stylesheet" href="css/postcard.css?v=45">
</head>
<body class="stage">

<a href="index.html" class="logo" aria-label="NOTJANG BOOOKS"><img src="assets/logo-dark.png" alt="NOTJANG BOOOKS"></a>
<div id="lang" class="lang" role="group" aria-label="Language"></div>

<main class="wr">
  <section class="wstep" data-step="1">
    <h1 id="h1"></h1>
    <p id="lead" class="lead"></p>
    <h2 id="s1"></h2>
    <div id="papers" class="papers"></div>
    <div class="bar"><span></span><button type="button" class="btn" data-go="2" data-t="next"></button></div>
    <div id="sent" class="sent" hidden>
      <h2 data-t="sentTitle"></h2>
      <ul id="sentList"></ul>
    </div>
  </section>

  <section class="wstep" data-step="2" hidden>
    <h2 id="s2"></h2>
    <div class="sheetwrap"><canvas id="front" class="sheetcv wide"></canvas><p id="busy" class="busy" data-t="printing" hidden></p></div>
    <div class="tools">
      <label class="btn ghost"><input type="file" accept="image/*" id="pick" hidden><span id="addlabel"></span></label>
    </div>
    <div id="photoTools" hidden>
      <p class="hint" data-t="drag"></p>
      <div id="inks" class="inks"></div>
    </div>
    <div class="bar"><button type="button" class="btn ghost" data-go="1" data-t="back"></button><button type="button" class="btn" id="to3" data-go="3" data-t="next"></button></div>
  </section>

  <section class="wstep" data-step="3" hidden>
    <h2 id="s3"></h2>
    <div id="fonts" class="chips" hidden><button type="button" class="chip on" id="fontSerif"></button><button type="button" class="chip" id="fontMine"></button></div>
    <textarea id="bodyIn" class="bodyin" rows="11"></textarea>
    <p class="count"><span id="left"></span></p>
    <p id="over" class="over" data-t="over" hidden></p>
    <canvas id="probe" hidden></canvas>
    <div class="bar"><button type="button" class="btn ghost" data-go="2" data-t="back"></button><button type="button" class="btn" id="to4" data-go="4" data-t="next"></button></div>
  </section>

  <section class="wstep" data-step="4" hidden>
    <h2 id="s4"></h2>
    <div id="flipper" class="flipper" role="button" tabindex="0">
      <canvas id="pf" class="sheetcv wide" data-face="front"></canvas>
      <canvas id="pb" class="sheetcv wide" data-face="back" hidden></canvas>
    </div>
    <p class="hint center" data-t="flip"></p>

    <div id="before">
      <p class="hint" data-t="notice"></p>
      <p id="err" class="over" hidden></p>
      <div class="bar"><button type="button" class="btn ghost" data-go="3" data-t="back"></button><button type="button" class="btn pink" id="make" data-t="make"></button></div>
    </div>

    <div id="after" hidden>
      <p class="ready" data-t="ready"></p>
      <input id="link" class="linkbox" type="text" readonly>
      <div class="tools">
        <button type="button" class="btn" id="copy" data-t="copy"></button>
        <button type="button" class="btn ghost" id="share" data-t="share" hidden></button>
        <a class="btn ghost" id="open" target="_blank" rel="noopener" data-t="open"></a>
      </div>
      <div class="tools">
        <button type="button" class="btn ghost" id="again" data-t="again"></button>
        <button type="button" class="btn ghost quiet" id="del" data-t="del"></button>
      </div>
      <p class="hint" data-t="keepNote"></p>
    </div>
  </section>
</main>

<script src="config.js?v=45"></script>
<script src="js/lang.js?v=45"></script>
<script src="js/riso.js?v=45"></script>
<script src="js/sheetkit.js?v=45"></script>
<script src="js/flip.js?v=45"></script>
<script src="js/postcard.js?v=45"></script>
</body>
</html>
