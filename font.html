<div id="lang" class="lang" role="group" aria-label="Language"></div>

<main class="fm">
  <h1 id="h1"></h1>
  <p id="lead" class="lead"></p>

  <section class="step">
    <h2 id="s1"></h2>
    <p id="s1p"></p>
    <button type="button" id="print" class="btn"></button>
    <div id="sheets" class="sheets"></div>
  </section>

  <section class="step">
    <h2 id="s2"></h2>
    <p id="s2p"></p>
    <label class="drop pickdrop"><input type="file" accept="image/*,application/pdf" multiple id="pick"><span id="picklabel"></span></label>
    <p class="bankinfo"><span id="bankinfo"></span> <button type="button" id="reset" class="lnk" hidden></button></p>
    <div id="uploads" class="uploads"></div>
  </section>

  <section class="step">
    <h2 id="s3"></h2>
    <p id="s3p"></p>
    <div class="opts"><label><input type="checkbox" id="even" checked> <span id="evenl"></span></label><label><input type="checkbox" id="align"> <span id="alignl"></span></label></div>
    <button type="button" id="make" class="btn" disabled></button>
    <p id="made" class="made"></p>
    <div id="result" class="result" hidden>
      <h3 id="sampleh"></h3>
      <div class="paper"><p id="sampleout" class="hand" data-def="오늘 찍은 사진 한 장에 몇 줄을 적으면 낱장 한 장이 됩니다. 왜 뭐 꿈 밥 옷 흡 특별한 하루, 안녕하세요 낱장북스. Hello World 1234567890"></p></div>
      <input id="sampletext" class="sampletext" type="text">
      <div class="usebox">
        <h3 id="useh"></h3>
        <p id="usep"></p>
        <a id="usewrite" class="btn" href="write.html?hand=1"></a>
        <a id="usepost" class="btn" href="postcard.html?hand=1"></a>
      </div>
      <button type="button" id="download" class="btn line"></button>
      <p id="after" class="after"></p>
      <div class="fixbox">
        <h3 id="fixh"></h3>
        <p id="fixp"></p>
        <input id="fixchars" class="sampletext" type="text">
        <button type="button" id="fixprint" class="btn"></button>
        <p id="fixnote" class="made"></p>
      </div>
    </div>
  </section>

  <p class="contact legal"><a id="legal" href="privacy.html"></a></p>
</main>
